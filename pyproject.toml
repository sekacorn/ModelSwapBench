[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "modelswapbench"
version = "0.1.0a6"
description = "Open-source model portability and replacement benchmark: measure which model delivers an acceptable outcome at the lowest cost, latency, and operational risk."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "sekacorn" }]
maintainers = [{ name = "sekacorn" }]
keywords = [
  "ai", "llm", "benchmark", "model-evaluation", "ollama", "local-first",
  "cost", "replacement", "portability", "provider-neutral", "devsecops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "agentforge-oss>=0.5.1,<0.6.0",
]

[project.urls]
Homepage = "https://github.com/sekacorn/ModelSwapBench"
Repository = "https://github.com/sekacorn/ModelSwapBench"
Issues = "https://github.com/sekacorn/ModelSwapBench/issues"
Changelog = "https://github.com/sekacorn/ModelSwapBench/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sekacorn/ModelSwapBench/tree/main/docs"

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
bedrock = ["boto3>=1.34"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4.21",
  "twine>=5.1",
]
security = [
  "bandit>=1.7",
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
]
quality = [
  "yamllint>=1.35",
]
all = [
  "openai>=1.40",
  "anthropic>=0.34",
  "boto3>=1.34",
]

[project.scripts]
modelswapbench = "model_swap_bench.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["model_swap_bench"]

[tool.hatch.build.targets.wheel.force-include]
"model_swap_bench/resources/benchmark.schema.json" = "model_swap_bench/resources/benchmark.schema.json"
"model_swap_bench/pricing/default_pricing.yaml" = "model_swap_bench/pricing/default_pricing.yaml"

[tool.hatch.build.targets.sdist]
include = [
  "model_swap_bench/**",
  "examples/**",
  "docs/**",
  "tests/**",
  "scripts/**",
  "ARCHITECTURE.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "CODEOWNERS",
  "LICENSE",
  "Makefile",
  "NOTICE.md",
  "README.md",
  "SECURITY.md",
  "THREAT_MODEL.md",
  "pyproject.toml",
]
exclude = [
  ".env",
  ".env.*",
  "**/.modelswapbench/**",
  "**/__pycache__/**",
  "reports/*/",
]

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
# S101: asserts are fine. B008: Typer uses call-in-defaults. UP042: str+Enum is
# intentional (broad compatibility). S104: 0.0.0.0 is a hostname literal, not a
# bind. S105: constants are key *names*, not secrets. S607: `git` on PATH is fine.
ignore = ["S101", "B008", "UP042", "S104", "S105", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests/fixtures", "build", "dist"]

[[tool.mypy.overrides]]
module = ["forge.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=model_swap_bench --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: tests that need external services (Ollama, network); deselect with -m 'not integration'",
]

[tool.bandit]
# B101 asserts guard internal invariants; B105 flags the literal "pass" in status
# enums; B104 is a hostname-classification literal, not a bind; B404/B603/B607 are
# a fixed-argument `git rev-parse` with no shell and no untrusted input.
skips = ["B101", "B104", "B105", "B404", "B603", "B607"]

[tool.coverage.run]
branch = true
source = ["model_swap_bench"]

[tool.coverage.report]
show_missing = true
fail_under = 80
