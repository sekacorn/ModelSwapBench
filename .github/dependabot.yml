version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # One pull request per week for all action bumps. Ungrouped, each action
  # arrives as its own branch cut from the same base, and two that touch
  # adjacent lines in the same workflow conflict with each other once the
  # first is merged. Grouping makes that impossible by construction.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
