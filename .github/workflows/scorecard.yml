name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 3 * * 1"
  push:
    branches: [main, master]
  # So the scan can be run on demand. Without this the only ways to trigger
  # it are the weekly cron, a push to the default branch, or a branch
  # protection change, which makes a fix impossible to verify promptly.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
