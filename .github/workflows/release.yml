name: Release

# Builds artifacts on a version tag, then publishes to PyPI via OIDC Trusted
# Publishing (no API tokens). PyPI verifies repository, workflow filename
# (release.yml), and environment (pypi) against the registered trusted publisher.

on:
  push:
    tags:
      # Only version tags start a release. A bare "v" prefix would also match
      # names like "vendor-audit", which would start a run that can only fail
      # the tag/version check.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to run against (for example v0.1.0b6)"
        required: true
        type: string
      dry_run:
        description: "Run every check but skip the PyPI upload"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The same gate CI applies to a pull request, re-run against the tagged
  # commit. Without it a release could publish code that no green CI run ever
  # covered, for example from a tag placed on an older commit.
  test:
    name: Test py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Report the release mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "event_name     = ${EVENT}"
          echo "inputs.dry_run = '${DRY_RUN}'"
          if [ "${EVENT}" != "push" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "mode           = DRY RUN (the PyPI upload and everything after it will be skipped)"
          else
            echo "mode           = REAL RELEASE (the PyPI upload will run)"
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # `security.yml` installs `[dev,security]` because bandit lives in the
      # security extra, not dev. Installing only `[dev]` here made the Bandit
      # step fail with "No module named bandit".
      - name: Install the package and its development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,security]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      # `strict = true` is set under [tool.mypy], so this is a strict run.
      - name: Strict mypy
        run: python -m mypy model_swap_bench

      - name: Pytest
        run: python -m pytest -m "not integration" --cov=model_swap_bench --cov-branch

      - name: Bandit
        run: python -m bandit -c pyproject.toml -r model_swap_bench -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Write checksums
        run: sha256sum dist/* > checksums.txt

      - name: Generate SBOM
        run: |
          python -m pip install cyclonedx-bom || true
          cyclonedx-py environment -o sbom.json || true

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: |
            dist/*
            checksums.txt
            sbom.json

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    # Must match the "Environment name" of the PyPI trusted publisher.
    # Skipped on a dry run. `inputs.dry_run` is empty on a push event,
    # so the event check comes first: a push is always a real release.
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    environment:
      name: pypi
      url: https://pypi.org/p/modelswapbench
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions

      - name: Refuse to upload during a dry run
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${EVENT}" != "push" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "This job must not run during a dry run. Failing instead of uploading."
            exit 1
          fi
          echo "Confirmed a real release: event=${EVENT} dry_run='${DRY_RUN}'"

      - name: Publish package distributions
        # v1.14.2 uses Twine 7+, which supports Core Metadata 2.5.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist
