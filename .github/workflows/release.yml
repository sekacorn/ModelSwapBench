name: Release

# Builds artifacts on a version tag, then publishes to PyPI via OIDC Trusted
# Publishing (no API tokens). PyPI verifies repository, workflow filename
# (release.yml), and environment (pypi) against the registered trusted publisher.

on:
  push:
    tags:
      # Only version tags start a release. A bare "v" prefix would also match
      # names like "vendor-audit", which would start a run that can only fail
      # the tag/version check.
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  # The same gate CI applies to a pull request, re-run against the tagged
  # commit. Without it a release could publish code that no green CI run ever
  # covered, for example from a tag placed on an older commit.
  test:
    name: Test py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      # `strict = true` is set under [tool.mypy], so this is a strict run.
      - name: Strict mypy
        run: python -m mypy model_swap_bench

      - name: Pytest
        run: python -m pytest -m "not integration" --cov=model_swap_bench --cov-branch

      - name: Bandit
        run: python -m bandit -c pyproject.toml -r model_swap_bench -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Write checksums
        run: sha256sum dist/* > checksums.txt

      - name: Generate SBOM
        run: |
          python -m pip install cyclonedx-bom || true
          cyclonedx-py environment -o sbom.json || true

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*
            checksums.txt
            sbom.json

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    # Must match the "Environment name" of the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/modelswapbench
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions

      - name: Publish package distributions
        # v1.14.2 uses Twine 7+, which supports Core Metadata 2.5.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
