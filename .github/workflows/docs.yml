name: Documentation

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Validate all example benchmarks
        run: |
          for f in examples/*/benchmark.yaml; do
            echo "validating $f"
            modelswapbench validate "$f"
          done
      - name: Export JSON schema
        run: modelswapbench schema --output benchmark.schema.json
