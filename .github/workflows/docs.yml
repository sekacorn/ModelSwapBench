name: Documentation

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Validate all example benchmarks
        run: |
          for f in examples/*/benchmark.yaml; do
            echo "validating $f"
            modelswapbench validate "$f"
          done
      - name: Export JSON schema
        run: modelswapbench schema --output benchmark.schema.json
