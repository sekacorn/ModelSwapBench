name: Packaging

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: modelswapbench --version
      - run: modelswapbench init smoke-deployment
      - run: modelswapbench validate smoke-deployment/benchmark.yaml
      - run: modelswapbench run smoke-deployment/benchmark.yaml
      - run: sha256sum dist/* > checksums.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: modelswapbench-dist
          path: |
            dist/*
            checksums.txt
